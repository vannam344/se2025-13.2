name: Deploy Server & Admin

on:
  push:
    branches:
      - development
    paths:
      - 'server/**'
      - 'admin/**'
      - 'nginx/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 34.27.61.12 >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_IP: 34.27.61.12
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh ${SERVER_USER}@${SERVER_IP} "
            set -e
            
            reclone_repo() {
                echo 'Self-healing: Re-cloning repository...'
                cd ~
                if [ -f server/server/.env ]; then cp server/server/.env .env.backup; 
                elif [ -f server/.env ]; then cp server/.env .env.backup; fi
                
                sudo rm -rf server
                git clone https://github.com/vannam344/se2025-13.2.git server
                
                if [ -f .env.backup ]; then
                    mkdir -p server/server
                    cp .env.backup server/server/.env
                    cp .env.backup server/.env
                fi
            }

            if [ ! -d ~/server/.git ]; then
                reclone_repo
            fi

            cd ~/server
            
            if ! git checkout development || ! git pull; then
                reclone_repo
                cd ~/server
                git checkout development
                git pull
            fi
            
            docker compose up -d --build backend admin nginx
          "